<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Story Engine v2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="top-bar-left">
          <span class="app-title">Story Engine v2</span>
          <select id="project-select" class="project-select"></select>
          <button id="project-new" class="btn small">Nuevo</button>
          <button id="project-load" class="btn small">Cargar</button>
          <button id="project-save" class="btn small primary">Guardar</button>
          <button id="project-export" class="btn small">Exportar</button>
        </div>
        <div class="top-bar-right">
          <button id="play-scene" class="btn small">Probar escena actual</button>
        </div>
      </header>

      <div class="tabs-bar">
        <button class="tab-button active" data-tab="graph">Grafo</button>
        <button class="tab-button" data-tab="characters">Personajes</button>
        <button class="tab-button" data-tab="flags">Flags</button>
        <button class="tab-button" data-tab="images">Imágenes</button>
        <button class="tab-button" data-tab="audio">Audio</button>
        <button class="tab-button" data-tab="settings">Configuración</button>
      </div>
      <main id="tab-content" class="tab-content"></main>
    </div>

    <div id="play-overlay" class="overlay hidden">
      <div class="overlay-content">
        <div class="overlay-header">
          <span>Prueba de escena</span>
          <button id="play-close" class="btn small">Cerrar</button>
        </div>
        <div id="play-view" class="play-view"></div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
  </html>
